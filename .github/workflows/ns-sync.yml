# 網頁「資料更新 → 從 NS 同步」按鈕觸發：從 NS 正式區匯出 D_Item、D_BOM、D_BOM_補（只讀），
# 用查看密碼加密後推到 ns-sync 分支（只留最新一次，不動 main），由網頁讀回、預覽差異後再發布。
# 需要的 Secrets：NS_ACCOUNT_ID、NS_CONSUMER_KEY、NS_CONSUMER_SECRET、NS_TOKEN_ID、NS_TOKEN_SECRET、SELLOUT_PASSWORD
name: NS 同步
run-name: NS sync ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 網頁產生的識別碼（手動執行可隨便填）
        required: true
        default: manual

permissions:
  contents: write

concurrency:
  group: ns-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ns_sync

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install --quiet requests cryptography

      - name: 從 NS 匯出並加密
        env:
          NS_ACCOUNT_ID: ${{ secrets.NS_ACCOUNT_ID }}
          NS_CONSUMER_KEY: ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SECRET: ${{ secrets.NS_CONSUMER_SECRET }}
          NS_TOKEN_ID: ${{ secrets.NS_TOKEN_ID }}
          NS_TOKEN_SECRET: ${{ secrets.NS_TOKEN_SECRET }}
          SELLOUT_PASSWORD: ${{ secrets.SELLOUT_PASSWORD }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python ns_sync/run_ns_sync.py --request-id "$REQUEST_ID" --out "$RUNNER_TEMP/out/ns_sync.enc"

      - name: 推到 ns-sync 分支
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b ns-sync
          git add ns_sync.enc
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "NS 同步 $REQUEST_ID"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ns-sync
